<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga Los Independientes - Estadísticas</title>
<style>
:root{--primary:#0091FF;--primary-dark:#0070CC;--primary-deeper:#004F99;--mlb-red:#BF0D3E;--gray:#f0f4f8;}
body{font-family:'Segoe UI',sans-serif;background:var(--gray);margin:0;padding:0;font-size:12px;}
.main-header{background:white;padding:15px 20px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--primary);}
.main-header img{height:80px;width:auto;}
.container{max-width:1600px;margin:20px auto;background:white;padding:20px;border-radius:10px;}
nav{display:flex;gap:10px;margin-bottom:20px;background:var(--primary);padding:12px;border-radius:8px;justify-content:center;flex-wrap:wrap;}
.nav-btn{background:white;color:var(--primary);border:none;padding:10px 18px;cursor:pointer;font-weight:bold;border-radius:5px;}
.view{display:none;}.active{display:block;}
table.report{width:100%;border-collapse:collapse;margin-top:10px;}
table.report th{background:var(--primary);color:white;padding:10px;border:1px solid var(--primary-dark);cursor:pointer;}
table.report th:hover{background:var(--primary-dark);}
table.report td{border:1px solid #d0e8ff;padding:8px;text-align:center;}
table.report tr:hover td{background:#f0f8ff;}
.leader-high{color:var(--mlb-red);font-weight:bold;}
.col-leader{background-color:#e0f2ff !important;font-weight:bold;color:var(--primary-deeper);}
.summary-row{background:#ddeeff;font-weight:bold;border-top:2px solid var(--primary);}
.section-title{background:var(--primary-dark);color:white;padding:8px 15px;margin-top:20px;font-weight:bold;border-radius:4px;}
.admin-box{background:#f0f6ff;padding:15px;border-radius:8px;border:1px solid #b0d4f8;margin-bottom:15px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;}
.multi-inn{background:#fff8e1;color:#7a4f00;font-weight:bold;}
a.player-link{color:#004F99;text-decoration:none;font-weight:bold;cursor:pointer;}
a.player-link:hover{color:#BF0D3E;text-decoration:underline;}
select.game-select{padding:6px 10px;border:1px solid #b0d4f8;border-radius:5px;font-size:13px;min-width:260px;background:white;color:#003070;}
.game-select-label{font-weight:bold;color:#004F99;}
</style>
</head>

function renderBox(optFecha,optNum){const fDate=(optFecha!==undefined&&optFecha!==null)?optFecha:document.getElementById('filterDate').value;const cont=document.getElementById('boxContent');cont.innerHTML="";let games;if(optNum!==undefined&&optNum!==null&&optNum!==''){games=db.filter(g=>g.fecha===fDate&&String(g.num)===String(optNum));}else if(fDate){games=db.filter(g=>g.fecha===fDate);}else{games=getSortedGames();}if(!games.length){cont.innerHTML='<p style="color:#888;text-align:center;padding:30px;">No hay juegos'+(fDate?' para esta fecha.':'.')+'</p>';return;}games.forEach(g=>{let bRows=g.bateo.map(p=>{const innC=(p.innings||[]).map(raw=>{const isM=raw&&(raw.includes('/')||raw.includes(','));return'<td class="'+(isM?'multi-inn':'')+'">'+(raw||'')+'</td>';}).join('');return'<tr><td style="text-align:left">'+p.nombre+'</td>'+innC+'<td>'+p.vb+'</td><td>'+p.c+'</td><td>'+p.h+'</td><td>'+p.b2+'</td><td>'+p.b3+'</td><td>'+p.hr+'</td><td>'+p.ci+'</td><td>'+p.bb+'</td><td>'+p.so+'</td><td class="leader-high">'+(p.vb>0?fmt(p.h/p.vb):'.---')+'</td></tr>';}).join('');const bt={vb:0,c:0,h:0,b2:0,b3:0,hr:0,ci:0,bb:0,so:0};g.bateo.forEach(p=>{bt.vb+=p.vb;bt.c+=p.c;bt.h+=p.h;bt.b2+=p.b2;bt.b3+=p.b3;bt.hr+=p.hr;bt.ci+=p.ci;bt.bb+=p.bb;bt.so+=p.so;});const bTotal='<tr class="summary-row"><td colspan="10">TOTALES</td><td>'+bt.vb+'</td><td>'+bt.c+'</td><td>'+bt.h+'</td><td>'+bt.b2+'</td><td>'+bt.b3+'</td><td>'+bt.hr+'</td><td>'+bt.ci+'</td><td>'+bt.bb+'</td><td>'+bt.so+'</td><td>'+(bt.vb>0?fmt(bt.h/bt.vb):'.---')+'</td></tr>';let pRows=g.pitcheo.map(p=>'<tr><td style="text-align:left">'+p.nombre+' ('+p.res+')</td><td>'+outsToIp(ipToOuts(p.ip))+'</td><td>'+p.h+'</td><td>'+p.c+'</td><td>'+p.cl+'</td><td>'+p.bb+'</td><td>'+p.so+'</td></tr>').join('');const pt={ip:0,h:0,c:0,cl:0,bb:0,so:0};g.pitcheo.forEach(p=>{pt.ip+=ipToOuts(p.ip);pt.h+=p.h;pt.c+=p.c;pt.cl+=p.cl;pt.bb+=p.bb;pt.so+=p.so;});const pTotal='<tr class="summary-row"><td style="text-align:left">TOTALES</td><td>'+outsToIp(pt.ip)+'</td><td>'+pt.h+'</td><td>'+pt.c+'</td><td>'+pt.cl+'</td><td>'+pt.bb+'</td><td>'+pt.so+'</td></tr>';cont.innerHTML+='<div style="background:#fff;padding:15px;margin-bottom:20px;border:1px solid #b0d4f8;border-radius:8px;"><h3 style="color:#0091FF;margin:0 0 10px;">VS '+g.rival.toUpperCase()+' — Juego '+g.num+'</h3>'+buildScoreboardHTML(g.scoreboard)+'<div class="section-title">BATEO</div><div style="overflow-x:auto;"><table class="report"><thead><tr><th>BATEADOR</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>VB</th><th>C</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>CI</th><th>BB</th><th>SO</th><th>AVG</th></tr></thead><tbody>'+bRows+bTotal+'</tbody></table></div><div class="section-title">PITCHEO</div><table class="report"><thead><tr><th>LANZADOR</th><th>IP</th><th>H</th><th>C</th><th>CL</th><th>BB</th><th>SO</th></tr></thead><tbody>'+pRows+pTotal+'</tbody></table></div>';});}
function renderLeaders(){const s={};db.forEach(g=>g.bateo.forEach(p=>{if(!s[p.nombre])s[p.nombre]={jj:0,vb:0,c:0,h:0,b2:0,b3:0,hr:0,ci:0,bb:0,so:0};const x=s[p.nombre];x.jj++;x.vb+=p.vb;x.c+=p.c;x.h+=p.h;x.b2+=p.b2;x.b3+=p.b3;x.hr+=p.hr;x.ci+=p.ci;x.bb+=p.bb;x.so+=p.so;}));let html="";Object.keys(s).sort((a,b)=>a.localeCompare(b)).forEach(n=>{const x=s[n],tb=(x.h-(x.b2+x.b3+x.hr))+(x.b2*2)+(x.b3*3)+(x.hr*4);html+='<tr><td style="text-align:left"><a class="player-link" href="#" data-player="'+n.replace(/"/g,'&quot;')+'" onclick="event.preventDefault();openPlayerHistory(this.getAttribute(\'data-player\'));">'+n+'</a></td><td>'+x.jj+'</td><td>'+x.vb+'</td><td>'+x.c+'</td><td>'+x.h+'</td><td>'+x.b2+'</td><td>'+x.b3+'</td><td>'+x.hr+'</td><td>'+x.ci+'</td><td>'+x.bb+'</td><td>'+x.so+'</td><td>'+tb+'</td><td>'+(x.vb>0?fmt(x.h/x.vb):'---')+'</td><td>'+((x.vb+x.bb)>0?fmt((x.h+x.bb)/(x.vb+x.bb)):'---')+'</td></tr>';});document.getElementById('leadBody').innerHTML=html||'<tr><td colspan="14" style="padding:20px;color:#888;">No hay datos.</td></tr>';}
function renderPitchingLeaders(){const s={};db.forEach(g=>g.pitcheo.forEach(p=>{if(!s[p.nombre])s[p.nombre]={g:0,p:0,ip:0,h:0,c:0,cl:0,bb:0,so:0};const x=s[p.nombre];x.ip+=ipToOuts(p.ip);x.h+=p.h;x.c+=p.c;x.cl+=p.cl;x.bb+=p.bb;x.so+=p.so;if(p.res==='G')x.g++;if(p.res==='P')x.p++;}));let html="";Object.keys(s).sort((a,b)=>a.localeCompare(b)).forEach(n=>{const x=s[n];html+='<tr><td style="text-align:left"><a class="player-link" href="#" data-player="'+n.replace(/"/g,'&quot;')+'" onclick="event.preventDefault();openPlayerHistory(this.getAttribute(\'data-player\'));">'+n+'</a></td><td>'+x.g+'-'+x.p+'</td><td>'+outsToIp(x.ip)+'</td><td>'+x.h+'</td><td>'+x.c+'</td><td>'+x.cl+'</td><td>'+x.bb+'</td><td>'+x.so+'</td><td>'+(x.ip>0?((x.cl*7)/(x.ip/3)).toFixed(2):'---')+'</td><td>'+(x.ip>0?((x.bb+x.h)/(x.ip/3)).toFixed(2):'---')+'</td></tr>';});document.getElementById('pitchBody').innerHTML=html||'<tr><td colspan="10" style="padding:20px;color:#888;">No hay datos.</td></tr>';}
function renderIndividual(){const q=document.getElementById('pSearch').value.toLowerCase(),fDate=document.getElementById('pSearchDate').value,div=document.getElementById('pDetail');div.innerHTML="";if(!q)return;let tBat={jj:0,vb:0,c:0,h:0,b2:0,b3:0,hr:0,ci:0,bb:0,so:0},logsBat="",batName="";db.forEach(g=>{if(fDate&&g.fecha!==fDate)return;g.bateo.forEach(p=>{if(p.nombre.toLowerCase().includes(q)){batName=p.nombre;tBat.jj++;tBat.vb+=p.vb;tBat.c+=p.c;tBat.h+=p.h;tBat.b2+=p.b2;tBat.b3+=p.b3;tBat.hr+=p.hr;tBat.ci+=p.ci;tBat.bb+=p.bb;tBat.so+=p.so;logsBat+='<tr><td>'+g.fecha+'</td><td>vs '+g.rival+'</td><td>'+p.vb+'</td><td>'+p.c+'</td><td>'+p.h+'</td><td>'+p.b2+'</td><td>'+p.b3+'</td><td>'+p.hr+'</td><td>'+p.ci+'</td><td>'+p.bb+'</td><td>'+p.so+'</td><td>'+(p.vb>0?fmt(p.h/p.vb):'.---')+'</td></tr>';}});});let tPit={jj:0,g:0,p:0,ip:0,h:0,c:0,cl:0,bb:0,so:0},logsPit="",pitName="";db.forEach(g=>{if(fDate&&g.fecha!==fDate)return;g.pitcheo.forEach(p=>{if(p.nombre.toLowerCase().includes(q)){pitName=p.nombre;tPit.jj++;tPit.ip+=ipToOuts(p.ip);tPit.h+=p.h;tPit.c+=p.c;tPit.cl+=p.cl;tPit.bb+=p.bb;tPit.so+=p.so;if(p.res==='G')tPit.g++;if(p.res==='P')tPit.p++;const ipStr=outsToIp(ipToOuts(p.ip)),ipReal=ipToOuts(p.ip)/3,era=ipReal>0?((p.cl*7)/ipReal).toFixed(2):'---';logsPit+='<tr><td>'+g.fecha+'</td><td>vs '+g.rival+'</td><td>'+(p.res||'-')+'</td><td>'+ipStr+'</td><td>'+p.h+'</td><td>'+p.c+'</td><td>'+p.cl+'</td><td>'+p.bb+'</td><td>'+p.so+'</td><td>'+era+'</td></tr>';}});});const displayName=(batName||pitName||'').toUpperCase();if(!displayName){div.innerHTML="<p style='color:#888;'>No se encontró el jugador.</p>";return;}const ff=fDate?' — Fecha: '+fDate:'';let html='<h3 style="color:#0091FF">RÉCORD HISTÓRICO: '+displayName+ff+'</h3>';if(batName){const totAvg=tBat.vb>0?fmt(tBat.h/tBat.vb):'.---';html+='<div class="section-title">BATEO</div><table class="report"><thead><tr><th>FECHA</th><th>RIVAL</th><th>VB</th><th>C</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>CI</th><th>BB</th><th>SO</th><th>AVG</th></tr></thead><tbody>'+logsBat+'<tr class="summary-row"><td colspan="2">TOTAL ('+tBat.jj+' JJ)</td><td>'+tBat.vb+'</td><td>'+tBat.c+'</td><td>'+tBat.h+'</td><td>'+tBat.b2+'</td><td>'+tBat.b3+'</td><td>'+tBat.hr+'</td><td>'+tBat.ci+'</td><td>'+tBat.bb+'</td><td>'+tBat.so+'</td><td class="leader-high">'+totAvg+'</td></tr></tbody></table>';}if(pitName){const ipReal=tPit.ip/3,totEra=ipReal>0?((tPit.cl*7)/ipReal).toFixed(2):'---',totWhip=ipReal>0?((tPit.bb+tPit.h)/ipReal).toFixed(2):'---';html+='<div class="section-title" style="margin-top:20px;">PITCHEO</div><table class="report"><thead><tr><th>FECHA</th><th>RIVAL</th><th>G/P</th><th>IP</th><th>H</th><th>C</th><th>CL</th><th>BB</th><th>SO</th><th>ERA</th></tr></thead><tbody>'+logsPit+'<tr class="summary-row"><td colspan="2">TOTAL ('+tPit.jj+' JJ)</td><td>'+tPit.g+'-'+tPit.p+'</td><td>'+outsToIp(tPit.ip)+'</td><td>'+tPit.h+'</td><td>'+tPit.c+'</td><td>'+tPit.cl+'</td><td>'+tPit.bb+'</td><td>'+tPit.so+'</td><td class="leader-high">'+totEra+'</td></tr></tbody></table><p style="margin-top:8px;color:#003070;font-size:12px;">ERA: <strong>'+totEra+'</strong> | WHIP: <strong>'+totWhip+'</strong></p>';}div.innerHTML=html;}
refreshGameSelect();document.getElementById('filterDate').value='';renderBox();
</script>

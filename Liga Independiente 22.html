<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Los Independientes - Estadísticas</title>
    <style>
        :root{--primary:#1a6b3c;--primary-dark:#145530;--nav-bg:#1a1f2e;--mlb-red:#BF0D3E;--gray:#f0f4f8;}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--gray);margin:0;padding:0;font-size:12px;}
        .main-header{background:white;padding:15px 20px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--nav-bg);}
        .main-header .logo-wrap{display:flex;align-items:center;gap:15px;}
        .container{max-width:1600px;margin:20px auto;background:white;padding:20px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.12);}
        nav{display:flex;gap:10px;margin-bottom:20px;background:var(--nav-bg);padding:12px;border-radius:8px;justify-content:center;flex-wrap:wrap;}
        .nav-btn{background:transparent;color:#ffffff;border:2px solid #ffffff;padding:10px 18px;cursor:pointer;font-weight:bold;border-radius:5px;font-size:13px;}
        .nav-btn:hover{background:rgba(255,255,255,0.15);}
        .view{display:none;}.active{display:block;}
        table.report{width:100%;border-collapse:collapse;margin-top:10px;}
        table.report th{background:var(--nav-bg);color:white;padding:10px;border:1px solid #2d3548;cursor:pointer;}
        table.report th:hover{background:#2d3548;}
        table.report td{border:1px solid #d0e8d8;padding:8px;text-align:center;}
        table.report tr:hover td{background:#f0f8f0;}
        .leader-high{color:var(--mlb-red);font-weight:bold;}
        .col-leader{background-color:#d4edda !important;font-weight:bold;color:#145530;}
        .summary-row{background:#d4edda;font-weight:bold;border-top:2px solid var(--primary);}
        .player-link{cursor:pointer;text-decoration:underline;color:#0d3d22;}
        .player-link:hover{color:var(--primary);}
        .player-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:2000;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;}
        .player-modal-overlay.active{display:flex;}
        .player-modal-box{background:#fff;border-radius:10px;max-width:950px;width:100%;max-height:85vh;overflow-y:auto;padding:20px 25px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,0.35);}
        .player-modal-box h2{color:var(--primary);margin:0 0 15px;font-size:18px;}
        .player-modal-close{position:absolute;top:12px;right:14px;background:var(--mlb-red);color:#fff;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;font-weight:bold;line-height:1;}
        .player-modal-close:hover{background:#8b0000;}
        .player-modal-note{margin-top:10px;color:#666;font-size:11px;}
        .section-title{background:var(--nav-bg);color:white;padding:8px 15px;margin-top:20px;font-weight:bold;border-radius:4px;letter-spacing:0.5px;}
        .admin-box{background:#f0f6f0;padding:15px;border-radius:8px;border:1px solid #b0d4b8;margin-bottom:15px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;}
        #leadersTable th:first-child,#leadersTable td:first-child{width:160px;min-width:160px;background:#1a1f2e;color:white;}
        #leadersTable td:first-child{background:#ffffff;color:#111;}
    </style>
</head>

    function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}
    function highlightColumnLeader(tableId,colIndex){const table=document.getElementById(tableId);if(!table)return;const tbody=table.querySelector('tbody');const rows=Array.from(tbody.rows);if(!rows.length)return;rows.forEach(r=>Array.from(r.cells).forEach(c=>c.classList.remove('col-leader')));let maxVal=-Infinity;rows.forEach(r=>{const val=parseFloat(r.cells[colIndex].innerText);if(!isNaN(val)&&val>maxVal)maxVal=val;});if(maxVal<=0||maxVal===-Infinity)return;rows.forEach(r=>{const val=parseFloat(r.cells[colIndex].innerText);if(!isNaN(val)&&val===maxVal)r.cells[colIndex].classList.add('col-leader');});}
    function sortLeadersTable(tableId,colIndex){const table=document.getElementById(tableId);const tbody=table.querySelector('tbody');const rows=Array.from(tbody.rows);let dir=table.dataset.sortDir==='asc'&&parseInt(table.dataset.sortCol)===colIndex?'desc':'asc';table.dataset.sortDir=dir;table.dataset.sortCol=colIndex;rows.sort((a,b)=>{let vA=a.cells[colIndex].innerText.trim(),vB=b.cells[colIndex].innerText.trim(),nA=parseFloat(vA),nB=parseFloat(vB);if(!isNaN(nA)&&!isNaN(nB))return dir==='asc'?nA-nB:nB-nA;return dir==='asc'?vA.localeCompare(vB):vB.localeCompare(vA);});rows.forEach(r=>tbody.appendChild(r));highlightColumnLeader(tableId,colIndex);}
    function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function getColumnStats(tableId,minCols,skipCols){minCols=minCols||[];skipCols=skipCols||[];const table=document.getElementById(tableId);const rows=Array.from(table.querySelector('tbody').rows).filter(r=>r.dataset.player);const best=[];if(!rows.length)return best;const numCols=rows[0].cells.length;for(let c=1;c<numCols;c++){if(skipCols.includes(c)){best[c]=null;continue;}const vals=rows.map(r=>parseFloat(r.cells[c].innerText)).filter(v=>!isNaN(v));if(!vals.length){best[c]=null;continue;}best[c]=minCols.includes(c)?Math.min(...vals):Math.max(...vals);}return best;}
    function closePlayerModal(){document.getElementById('playerModalOverlay').classList.remove('active');}
    function openBatterModal(name){const table=document.getElementById('leadersTable');const row=Array.from(table.querySelector('tbody').rows).find(r=>r.dataset.player===name);if(!row)return;const best=getColumnStats('leadersTable',[],[]);let totalsHtml='<tr class="summary-row"><td style="text-align:left">TOTAL TEMPORADA</td>';for(let c=1;c<row.cells.length;c++){const val=row.cells[c].innerText,num=parseFloat(val),isLeader=best[c]!=null&&!isNaN(num)&&num===best[c];totalsHtml+='<td'+(isLeader?' class="leader-high"':'')+'>'+val+'</td>';}totalsHtml+='</tr>';let logs='';db.forEach(g=>{g.bateo.forEach(p=>{if(p.nombre===name){const tb=(p.h-(p.b2+p.b3+p.hr))+(p.b2*2)+(p.b3*3)+(p.hr*4);logs+='<tr><td style="text-align:left">'+g.fecha+' vs '+g.rival+'</td><td>1</td><td>'+p.vb+'</td><td>'+p.c+'</td><td>'+p.h+'</td><td>'+p.b2+'</td><td>'+p.b3+'</td><td>'+p.hr+'</td><td>'+p.ci+'</td><td>'+p.bb+'</td><td>'+p.so+'</td><td>'+tb+'</td><td>'+fmt(p.h/p.vb||0)+'</td><td>'+fmt((p.h+p.bb)/(p.vb+p.bb)||0)+'</td></tr>';}});});const html='<h2>⚾ '+name.toUpperCase()+' — BATEO</h2><div class="table-scroll-wrapper"><table class="report"><thead><tr><th>FECHA</th><th>JJ</th><th>VB</th><th>C</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>CI</th><th>BB</th><th>SO</th><th>TB</th><th>AVG</th><th>OBP</th></tr></thead><tbody>'+logs+totalsHtml+'</tbody></table></div><p class="player-modal-note">🔴 En rojo: departamentos donde el jugador es líder de la tabla.</p>';document.getElementById('playerModalBody').innerHTML=html;document.getElementById('playerModalOverlay').classList.add('active');}
    function openPitcherModal(name){const table=document.getElementById('pitchTable');const row=Array.from(table.querySelector('tbody').rows).find(r=>r.dataset.player===name);if(!row)return;const best=getColumnStats('pitchTable',[8,9],[1]);let totalsHtml='<tr class="summary-row"><td style="text-align:left">TOTAL TEMPORADA</td>';for(let c=1;c<row.cells.length;c++){const val=row.cells[c].innerText,num=parseFloat(val),isLeader=best[c]!=null&&!isNaN(num)&&num===best[c];totalsHtml+='<td'+(isLeader?' class="leader-high"':'')+'>'+val+'</td>';}totalsHtml+='</tr>';let logs='';db.forEach(g=>{g.pitcheo.forEach(p=>{if(p.nombre===name){const ipR=realIp(p.ip);const era=((p.cl*7)/ipR||0).toFixed(2),whip=((p.bb+p.h)/ipR||0).toFixed(2);logs+='<tr><td style="text-align:left">'+g.fecha+' vs '+g.rival+'</td><td>'+(p.res||'-')+'</td><td>'+fmtIp(p.ip)+'</td><td>'+p.h+'</td><td>'+p.c+'</td><td>'+p.cl+'</td><td>'+p.bb+'</td><td>'+p.so+'</td><td>'+era+'</td><td>'+whip+'</td></tr>';}});});const html='<h2>⚾ '+name.toUpperCase()+' — PITCHEO</h2><div class="table-scroll-wrapper"><table class="report"><thead><tr><th>FECHA</th><th>DEC</th><th>IP</th><th>H</th><th>C</th><th>CL</th><th>BB</th><th>SO</th><th>ERA</th><th>WHIP</th></tr></thead><tbody>'+logs+totalsHtml+'</tbody></table></div><p class="player-modal-note">🔴 En rojo: departamentos donde el lanzador es líder de la tabla (ERA y WHIP: el valor más bajo).</p>';document.getElementById('playerModalBody').innerHTML=html;document.getElementById('playerModalOverlay').classList.add('active');}
    function buildScoreboardHTML(sb){if(!sb)return'';const vInns=(sb.visitorInns||[]).map(v=>'<td style="border:1px solid #b0d4b8;background:#ffffff;color:#111111;font-size:14px;font-weight:bold;text-align:center;padding:7px 10px;">'+(v||'')+'</td>').join('');const lInns=(sb.homeInns||[]).map(v=>'<td style="border:1px solid #b0d4b8;background:#ffffff;color:#111111;font-size:14px;font-weight:bold;text-align:center;padding:7px 10px;">'+(v||'')+'</td>').join('');const totStyle='border:1px solid #145530;background:#d4edda;color:#0d3d22;font-size:15px;font-weight:bold;text-align:center;padding:7px 12px;';return '<div style="margin-bottom:18px;"><div style="background:#1a1f2e;color:white;padding:6px 14px;font-weight:bold;font-size:13px;border-radius:4px 4px 0 0;">🏟️ PIZARRA DE ENTRADAS</div><table style="border-collapse:collapse;width:100%;background:#ffffff;border:2px solid #1a6b3c;"><thead><tr><th style="background:#1a1f2e;color:#ffffff;padding:7px 10px;border:1px solid #2d3548;text-align:left;min-width:110px;">EQUIPO</th>'+[1,2,3,4,5,6,7,8,9].map(n=>'<th style="background:#1a1f2e;color:#ffffff;padding:7px 10px;border:1px solid #2d3548;text-align:center;">'+n+'</th>').join('')+'<th style="background:#145530;color:#ffffff;padding:7px 10px;border:1px solid #1a6b3c;text-align:center;">R</th><th style="background:#145530;color:#ffffff;padding:7px 10px;border:1px solid #1a6b3c;text-align:center;">H</th><th style="background:#145530;color:#ffffff;padding:7px 10px;border:1px solid #1a6b3c;text-align:center;">E</th></tr></thead><tbody><tr><td style="background:#f0f8f0;color:#0d3d22;font-weight:bold;text-align:left;padding:6px 12px;font-size:13px;">'+(sb.visitorName||'VISITANTE')+'</td>'+vInns+'<td style="'+totStyle+'">'+(sb.vR||'')+'</td><td style="'+totStyle+'">'+(sb.vH||'')+'</td><td style="'+totStyle+'">'+(sb.vE||'')+'</td></tr><tr><td style="background:#f0f8f0;color:#0d3d22;font-weight:bold;text-align:left;padding:6px 12px;font-size:13px;">'+(sb.homeName||'LOCAL')+'</td>'+lInns+'<td style="'+totStyle+'">'+(sb.lR||'')+'</td><td style="'+totStyle+'">'+(sb.lH||'')+'</td><td style="'+totStyle+'">'+(sb.lE||'')+'</td></tr></tbody></table></div>';}
    function renderBox(){const fDate=document.getElementById('filterDate').value,container=document.getElementById('boxContent');container.innerHTML="";const games=db.filter(g=>g.fecha===fDate);if(!games.length){container.innerHTML='<p style="color:#888;text-align:center;padding:30px;">No hay juegos guardados para esta fecha.</p>';return;}games.forEach(g=>{let bRows=g.bateo.map(p=>'<tr><td style="text-align:left">'+p.nombre+'</td><td>'+p.vb+'</td><td>'+p.c+'</td><td>'+p.h+'</td><td>'+p.b2+'</td><td>'+p.b3+'</td><td>'+p.hr+'</td><td>'+p.ci+'</td><td>'+p.bb+'</td><td>'+p.so+'</td><td class="leader-high">'+fmt(p.h/p.vb||0)+'</td></tr>').join('');const bT=g.bateo.reduce((a,p)=>{a.vb+=p.vb;a.c+=p.c;a.h+=p.h;a.b2+=p.b2;a.b3+=p.b3;a.hr+=p.hr;a.ci+=p.ci;a.bb+=p.bb;a.so+=p.so;return a;},{vb:0,c:0,h:0,b2:0,b3:0,hr:0,ci:0,bb:0,so:0});if(g.bateo.length)bRows+='<tr class="summary-row"><td style="text-align:left">TOTALES</td><td>'+bT.vb+'</td><td>'+bT.c+'</td><td>'+bT.h+'</td><td>'+bT.b2+'</td><td>'+bT.b3+'</td><td>'+bT.hr+'</td><td>'+bT.ci+'</td><td>'+bT.bb+'</td><td>'+bT.so+'</td><td>'+fmt(bT.h/bT.vb||0)+'</td></tr>';let pRows=g.pitcheo.map(p=>'<tr><td style="text-align:left">'+p.nombre+' ('+p.res+')</td><td>'+fmtIp(p.ip)+'</td><td>'+p.h+'</td><td>'+p.c+'</td><td>'+p.cl+'</td><td>'+p.bb+'</td><td>'+p.so+'</td></tr>').join('');const pT=g.pitcheo.reduce((a,p)=>{a.outs+=ipToOuts(p.ip);a.h+=p.h;a.c+=p.c;a.cl+=p.cl;a.bb+=p.bb;a.so+=p.so;return a;},{outs:0,h:0,c:0,cl:0,bb:0,so:0});if(g.pitcheo.length)pRows+='<tr class="summary-row"><td style="text-align:left">TOTALES</td><td>'+fmtIp(outsToIp(pT.outs))+'</td><td>'+pT.h+'</td><td>'+pT.c+'</td><td>'+pT.cl+'</td><td>'+pT.bb+'</td><td>'+pT.so+'</td></tr>';container.innerHTML+='<div style="background:#fff;padding:15px;margin-bottom:20px;border:1px solid #b0d4b8;border-radius:8px;"><h3 style="color:#1a6b3c;margin:0 0 10px;">VS '+g.rival.toUpperCase()+' — Juego '+g.num+'</h3>'+buildScoreboardHTML(g.scoreboard)+'<div class="section-title">BATEO</div><table class="report"><thead><tr><th>BATEADOR</th><th>VB</th><th>C</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>CI</th><th>BB</th><th>SO</th><th>AVG</th></tr></thead><tbody>'+bRows+'</tbody></table><div class="section-title">PITCHEO</div><table class="report"><thead><tr><th>LANZADOR</th><th>IP</th><th>H</th><th>C</th><th>CL</th><th>BB</th><th>SO</th></tr></thead><tbody>'+pRows+'</tbody></table></div>';});}
    function renderLeaders(){const s={};db.forEach(g=>g.bateo.forEach(p=>{if(!s[p.nombre])s[p.nombre]={jj:0,vb:0,c:0,h:0,b2:0,b3:0,hr:0,ci:0,bb:0,so:0};let x=s[p.nombre];x.jj++;x.vb+=p.vb;x.c+=p.c;x.h+=p.h;x.b2+=p.b2;x.b3+=p.b3;x.hr+=p.hr;x.ci+=p.ci;x.bb+=p.bb;x.so+=p.so;}));let html="";Object.keys(s).forEach(n=>{const x=s[n],tb=(x.h-(x.b2+x.b3+x.hr))+(x.b2*2)+(x.b3*3)+(x.hr*4);html+='<tr data-player="'+escAttr(n)+'"><td style="text-align:left"><strong class="player-link">'+n+'</strong></td><td>'+x.jj+'</td><td>'+x.vb+'</td><td>'+x.c+'</td><td>'+x.h+'</td><td>'+x.b2+'</td><td>'+x.b3+'</td><td>'+x.hr+'</td><td>'+x.ci+'</td><td>'+x.bb+'</td><td>'+x.so+'</td><td>'+tb+'</td><td>'+fmt(x.h/x.vb||0)+'</td><td>'+fmt((x.h+x.bb)/(x.vb+x.bb)||0)+'</td></tr>';});document.getElementById('leadBody').innerHTML=html||'<tr><td colspan="14" style="padding:20px;color:#888;">No hay datos de bateo aún.</td></tr>';}
    function renderPitchingLeaders(){const s={};db.forEach(g=>g.pitcheo.forEach(p=>{if(!s[p.nombre])s[p.nombre]={g:0,p:0,outs:0,h:0,c:0,cl:0,bb:0,so:0};let x=s[p.nombre];x.outs+=ipToOuts(p.ip);x.h+=p.h;x.c+=p.c;x.cl+=p.cl;x.bb+=p.bb;x.so+=p.so;if(p.res==='G')x.g++;if(p.res==='P')x.p++;}));let html="";Object.keys(s).forEach(n=>{const x=s[n];const ipDisp=outsToIp(x.outs);const ipReal=x.outs/3;html+='<tr data-player="'+escAttr(n)+'"><td style="text-align:left"><strong class="player-link">'+n+'</strong></td><td>'+x.g+'-'+x.p+'</td><td>'+fmtIp(ipDisp)+'</td><td>'+x.h+'</td><td>'+x.c+'</td><td>'+x.cl+'</td><td>'+x.bb+'</td><td>'+x.so+'</td><td>'+((x.cl*7)/ipReal||0).toFixed(2)+'</td><td>'+((x.bb+x.h)/ipReal||0).toFixed(2)+'</td></tr>';});document.getElementById('pitchBody').innerHTML=html||'<tr><td colspan="10" style="padding:20px;color:#888;">No hay datos de pitcheo aún.</td></tr>';}
    function renderIndividual(){const q=document.getElementById('pSearch').value.toLowerCase(),fDate=document.getElementById('pSearchDate').value,div=document.getElementById('pDetail');div.innerHTML="";if(!q)return;let t={jj:0,vb:0,c:0,h:0,b2:0,b3:0,hr:0,ci:0,bb:0,so:0},logs="",pName="";db.forEach(g=>{if(fDate&&g.fecha!==fDate)return;g.bateo.forEach(p=>{if(p.nombre.toLowerCase().includes(q)){pName=p.nombre;t.jj++;t.vb+=p.vb;t.c+=p.c;t.h+=p.h;t.b2+=p.b2;t.b3+=p.b3;t.hr+=p.hr;t.ci+=p.ci;t.bb+=p.bb;t.so+=p.so;logs+='<tr><td>'+g.fecha+'</td><td>vs '+g.rival+'</td><td>'+p.vb+'</td><td>'+p.c+'</td><td>'+p.h+'</td><td>'+p.b2+'</td><td>'+p.b3+'</td><td>'+p.hr+'</td><td>'+p.ci+'</td><td>'+p.bb+'</td><td>'+p.so+'</td><td>'+fmt(p.h/p.vb||0)+'</td></tr>';}});});if(pName){const ff=fDate?' — Fecha: '+fDate:'';div.innerHTML='<h3 style="color:#1a6b3c">RÉCORD HISTÓRICO: '+pName.toUpperCase()+ff+'</h3><table class="report"><thead><tr><th>FECHA</th><th>RIVAL</th><th>VB</th><th>C</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>CI</th><th>BB</th><th>SO</th><th>AVG</th></tr></thead><tbody>'+logs+'<tr class="summary-row"><td colspan="2">TOTAL ('+t.jj+' JUEGOS)</td><td>'+t.vb+'</td><td>'+t.c+'</td><td>'+t.h+'</td><td>'+t.b2+'</td><td>'+t.b3+'</td><td>'+t.hr+'</td><td>'+t.ci+'</td><td>'+t.bb+'</td><td>'+t.so+'</td><td class="leader-high">'+fmt(t.h/t.vb||0)+'</td></tr></tbody></table>';}else{div.innerHTML="<p style='color:#888;'>No se encontró ningún jugador con ese nombre.</p>";}}
    document.getElementById('leadBody').addEventListener('click',function(e){const tr=e.target.closest('tr[data-player]');if(tr)openBatterModal(tr.dataset.player);});
    document.getElementById('pitchBody').addEventListener('click',function(e){const tr=e.target.closest('tr[data-player]');if(tr)openPitcherModal(tr.dataset.player);});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closePlayerModal();});
    actualizarSelectsFecha(); renderBox();
</script>
